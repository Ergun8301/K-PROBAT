<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════════════
     INTERFACE D'ADMINISTRATION — page privée, jamais indexée.
     Elle ne fait rien toute seule : elle parle à worker/admin.js, qui écrit
     dans le dépôt GitHub. Le déploiement habituel fait le reste.
     Pas de bibliothèque externe : tout est dans ce fichier.
     ══════════════════════════════════════════════════════════════════════ -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administration — K-ProBat</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#221E19;--cream:#EAE3D4;--acc:#D93916;--ok:#25D366;--bord:rgba(34,30,25,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button{font:inherit;cursor:pointer;border:none;border-radius:3px}
input,textarea,select{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bord);border-radius:3px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(34,30,25,.6);margin:12px 0 5px}

/* --- connexion --- */
#connexion{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#connexion form{width:100%;max-width:340px;background:#fff;padding:30px;border-radius:5px;box-shadow:0 10px 40px rgba(34,30,25,.12)}
#connexion h1{margin:0 0 4px;font-size:21px}
#connexion p{margin:0 0 20px;font-size:13px;color:rgba(34,30,25,.6)}

/* --- cadre --- */
header{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:14px;padding:11px 16px;flex-wrap:wrap}
header b{font-size:14px;letter-spacing:.08em;text-transform:uppercase}
header .grandit{flex:1}
.btn{padding:10px 18px;background:var(--acc);color:#fff;font-weight:700}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-2{background:transparent;color:var(--cream);border:1px solid rgba(234,227,212,.4);padding:9px 14px}

nav{display:flex;gap:4px;padding:10px 16px 0;flex-wrap:wrap;background:var(--cream);position:sticky;top:52px;z-index:19}
nav button{padding:9px 15px;background:transparent;border:1px solid transparent;color:rgba(34,30,25,.62);font-weight:600}
nav button[aria-selected=true]{background:#fff;border-color:var(--bord);color:var(--ink)}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:16px;align-items:start}
@media (max-width:1000px){main{grid-template-columns:1fr}#apercu{display:none}}
#apercu{position:sticky;top:104px;height:calc(100dvh - 128px);background:#fff;border:1px solid var(--bord);border-radius:5px;overflow:hidden;display:flex;flex-direction:column}
#apercu .barre{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bord);font-size:12px;color:rgba(34,30,25,.6)}
#apercu iframe{flex:1;border:0;width:100%}

.bloc{background:#fff;border:1px solid var(--bord);border-radius:5px;padding:16px;margin-bottom:14px}
.bloc h2{margin:0 0 4px;font-size:16px}
.bloc .aide{margin:0 0 14px;font-size:13px;color:rgba(34,30,25,.6)}
.carte{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:14px 0;border-top:1px solid var(--bord)}
.carte:first-of-type{border-top:0}
.vignette{width:112px;height:112px;object-fit:cover;border-radius:3px;background:#eee;display:block;cursor:pointer;border:1px solid var(--bord)}
.vignette:hover{outline:2px solid var(--acc);outline-offset:2px}
.sous{font-size:11px;color:rgba(34,30,25,.5);text-align:center;margin-top:5px;cursor:pointer;text-decoration:underline}
.num{font-weight:800;color:var(--acc);font-size:12px;letter-spacing:.1em}

/* --- sélecteur de photo --- */
dialog{border:0;border-radius:6px;padding:0;max-width:820px;width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(34,30,25,.55)}
.tete{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--bord)}
.tete h3{margin:0;font-size:16px;flex:1}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;padding:16px;max-height:62vh;overflow:auto}
.grille figure{margin:0;cursor:pointer;border:2px solid transparent;border-radius:4px;overflow:hidden}
.grille figure:hover{border-color:var(--acc)}
.grille img{width:100%;height:96px;object-fit:cover;display:block}
.grille figcaption{font-size:10px;padding:4px 5px;color:rgba(34,30,25,.6);word-break:break-all}
.pied{padding:14px 18px;border-top:1px solid var(--bord);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

#etat{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;max-width:min(560px,92vw);padding:14px 18px;border-radius:4px;background:var(--ink);color:var(--cream);box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:pre-line;display:none}
#etat.bien{background:#12421f}
#etat.mal{background:#7d1d0c}
/* Message DANS le sélecteur de photo : il ne disparaît jamais tout seul.
   Une erreur de téléversement doit rester lisible là où on l'a déclenchée. */
#etatPhoto{display:none;margin:0;padding:12px 18px;border-top:1px solid var(--bord);
  font-size:13.5px;line-height:1.5;white-space:pre-line}
#etatPhoto.mal{display:block;background:#fdecea;color:#7d1d0c}
#etatPhoto.bien{display:block;background:#eaf4ec;color:#12421f}
#etatPhoto.info{display:block;background:#f3f0ea;color:var(--ink)}
.cache{display:none !important}
</style>
</head>
<body>

<section id="connexion">
  <form id="formConnexion">
    <h1>K-ProBat</h1>
    <p>Administration du site</p>
    <label for="mdp">Mot de passe</label>
    <input id="mdp" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Entrer</button>
    <p id="erreurConnexion" style="color:var(--acc);margin:12px 0 0"></p>
  </form>
</section>

<div id="app" class="cache">
  <header>
    <b>K-ProBat — Administration</b>
    <span class="grandit"></span>
    <span id="compteur" style="font-size:12.5px;opacity:.75"></span>
    <button class="btn" id="publier" disabled>Publier</button>
    <button class="btn-2" id="deconnexion">Quitter</button>
  </header>

  <nav id="onglets">
    <button data-vue="bandeau" aria-selected="true">Bandeau d'accueil</button>
    <button data-vue="accueil" aria-selected="false">Accueil</button>
    <button data-vue="realisations" aria-selected="false">Réalisations</button>
    <button data-vue="siporex" aria-selected="false">Page Siporex</button>
    <button data-vue="villes" aria-selected="false">Pages villes</button>
  </nav>

  <main>
    <div id="editeur"></div>
    <div id="apercu">
      <div class="barre">
        <span id="apercuTitre">Aperçu</span>
        <span style="flex:1"></span>
        <button class="btn-2" style="color:var(--ink);border-color:var(--bord);padding:5px 10px;font-size:12px" id="rafraichir">Revoir la version en ligne</button>
      </div>
      <iframe id="cadre" title="Aperçu du site"></iframe>
    </div>
  </main>
</div>

<dialog id="choixPhoto">
  <div class="tete">
    <h3>Choisir une photo</h3>
    <button class="btn-2" style="color:var(--ink);border-color:var(--bord)" onclick="choixPhoto.close()">Fermer</button>
  </div>
  <div class="grille" id="grillePhotos"></div>
  <div class="pied">
    <button class="btn" id="boutonEnvoi">Ajouter une photo depuis mon appareil</button>
    <input type="file" id="fichier"
           accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" class="cache">
    <span style="font-size:12.5px;color:rgba(34,30,25,.6)">JPEG, PNG ou HEIC (iPhone). Redimensionnée automatiquement.</span>
  </div>
  <p id="etatPhoto"></p>
</dialog>

<div id="etat"></div>

<script>
(function () {
  'use strict';
  var D = null;            // les données chargées depuis le dépôt
  var vue = 'bandeau';
  var modifie = false;
  var ciblePhoto = null;   // fonction appelée quand une photo est choisie
  var cheminPhoto = null;  // chemin JSON de cette photo, pour l'aperçu direct

  var $ = function (s) { return document.querySelector(s); };
  var ech = function (s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  function dire(msg, genre) {
    var e = $('#etat');
    e.textContent = msg;
    e.className = genre || '';
    e.style.display = 'block';
    clearTimeout(dire.t);
    dire.t = setTimeout(function () { e.style.display = 'none'; }, genre === 'mal' ? 12000 : 6000);
  }

  function api(chemin, options) {
    return fetch('/api/admin/' + chemin, Object.assign({ headers: { 'content-type': 'application/json' } }, options || {}))
      .then(function (r) { return r.json().then(function (d) { return { http: r.status, d: d }; }); });
  }

  function marquerModifie() {
    modifie = true;
    $('#publier').disabled = false;
    $('#compteur').textContent = 'modifications non publiées';
    majTitreApercu();
  }

  /* ---- APERÇU DIRECT ---------------------------------------------------
     L'aperçu est une iframe de la MÊME origine : son document est donc
     accessible, et on peut y écrire. Chaque élément modifiable du site porte
     un attribut data-champ dont la valeur est le chemin exact dans le JSON
     (« savoirFaire.2.t », « bandeau.0.img »…). On retrouve l'élément par ce
     chemin et on le met à jour à la frappe : plus besoin d'attendre la
     reconstruction du site pour voir sa modification.
     Un champ « …alt » n'a pas d'élément à lui : il décrit la photo, donc il
     modifie l'attribut alt de l'élément marqué « …img » correspondant. */
  function elementsPour(champ) {
    var doc = $('#cadre').contentDocument;
    if (!doc) return { doc: null, els: [], attribut: null };
    var cible = champ, attribut = null;
    if (/\.alt$/.test(champ)) { cible = champ.replace(/\.alt$/, '.img'); attribut = 'alt'; }
    else if (champ === 'betonCellulaire.imgAlt') { cible = 'betonCellulaire.img'; attribut = 'alt'; }
    return {
      doc: doc,
      els: [].slice.call(doc.querySelectorAll('[data-champ="' + cible + '"]')),
      attribut: attribut,
    };
  }

  function patcher(champ, valeur) {
    var t;
    try { t = elementsPour(champ); } catch (e) { return; } // iframe pas encore prête
    if (!t.doc) return;
    t.els.forEach(function (el) {
      if (t.attribut === 'alt') { el.setAttribute('alt', valeur); return; }
      if (el.tagName === 'IMG') {
        var dossier = champ === 'partage.img' ? '/assets/og/' : '/assets/img/';
        el.setAttribute('src', dossier + valeur);
        return;
      }
      // Les paragraphes de la section béton cellulaire contiennent du gras :
      // on garde donc le HTML pour ces champs, du texte simple pour les autres.
      if (/[<>]/.test(valeur)) el.innerHTML = valeur; else el.textContent = valeur;
    });
  }

  // Réapplique TOUTES les valeurs courantes : après un changement de page
  // dans l'aperçu, le document est neuf et ne connaît pas le brouillon.
  function rejouerToutLeBrouillon() {
    if (!D) return;
    var c = D.contenu;
    (c.bandeau || []).forEach(function (b, i) {
      patcher('bandeau.' + i + '.img', b.img); patcher('bandeau.' + i + '.alt', b.alt);
    });
    c.savoirFaire.forEach(function (m, i) {
      patcher('savoirFaire.' + i + '.img', m.img);
      patcher('savoirFaire.' + i + '.t', m.t);
      patcher('savoirFaire.' + i + '.tech', m.tech);
    });
    c.realisations.forEach(function (r, i) {
      patcher('realisations.' + i + '.img', r.img);
      patcher('realisations.' + i + '.t', r.t);
      patcher('realisations.' + i + '.meta', r.meta);
    });
    var bc = c.betonCellulaire;
    ['p1', 'p2', 'p3', 'chiffre', 'chiffreTexte', 'img'].forEach(function (k) {
      patcher('betonCellulaire.' + k, bc[k]);
    });
    patcher('betonCellulaire.imgAlt', bc.imgAlt);
    ['photo1', 'photo2', 'photo3'].forEach(function (k) {
      var ph = c.pagePilier[k];
      patcher('pagePilier.' + k + '.img', ph.img);
      patcher('pagePilier.' + k + '.legende', ph.legende);
      patcher('pagePilier.' + k + '.alt', ph.alt);
    });
  }

  function majTitreApercu() {
    $('#apercuTitre').textContent = modifie
      ? 'Aperçu de vos modifications (non publiées)'
      : 'Version en ligne';
    $('#apercuTitre').style.color = modifie ? 'var(--acc)' : '';
  }

  /* ---- connexion ------------------------------------------------------- */
  $('#formConnexion').addEventListener('submit', function (ev) {
    ev.preventDefault();
    api('connexion', { method: 'POST', body: JSON.stringify({ motDePasse: $('#mdp').value }) })
      .then(function (r) {
        if (!r.d.ok) { $('#erreurConnexion').textContent = r.d.erreur || 'Connexion impossible.'; return; }
        $('#connexion').classList.add('cache');
        $('#app').classList.remove('cache');
        charger();
      })
      .catch(function () { $('#erreurConnexion').textContent = 'Le site ne répond pas.'; });
  });

  $('#deconnexion').addEventListener('click', function () {
    if (modifie && !confirm('Des modifications ne sont pas publiées. Quitter quand même ?')) return;
    api('deconnexion', { method: 'POST' }).then(function () { location.reload(); });
  });

  /* ---- chargement ------------------------------------------------------ */
  function charger() {
    api('contenu').then(function (r) {
      if (!r.d.ok) { dire(r.d.erreur || 'Chargement impossible.', 'mal'); return; }
      D = r.d;
      dessiner();
      $('#cadre').src = '/';
    });
  }

  // Recharger la page remet la version PUBLIÉE : on réapplique donc aussitôt
  // le brouillon, sinon l'utilisateur verrait ses modifications disparaître.
  $('#cadre').addEventListener('load', function () {
    if (/[?&]enligne=/.test($('#cadre').src)) return; // comparaison volontaire
    setTimeout(rejouerToutLeBrouillon, 60);
  });

  // « Revoir la version en ligne » : on recharge SANS réappliquer, pour
  // comparer avec ce qui est réellement publié.
  $('#rafraichir').addEventListener('click', function () {
    var garde = modifie;
    modifie = false;
    $('#cadre').src = $('#cadre').src.split('?')[0] + '?enligne=' + Date.now();
    setTimeout(function () { modifie = garde; majTitreApercu(); }, 1200);
    $('#apercuTitre').textContent = 'Version en ligne';
    $('#apercuTitre').style.color = '';
  });

  /* ---- sélecteur de photo --------------------------------------------- */
  function ouvrirPhotos(surChoix, chemin) {
    ciblePhoto = surChoix;
    cheminPhoto = chemin || null;
    $('#grillePhotos').innerHTML = D.photos.map(function (n) {
      return '<figure data-nom="' + ech(n) + '"><img src="/assets/img/' + encodeURIComponent(n) +
        '" alt="" loading="lazy"><figcaption>' + ech(n) + '</figcaption></figure>';
    }).join('');
    direPhoto('');                       // on repart d'un message vide
    // showModal() sur une boîte déjà ouverte lève une erreur : après un envoi,
    // on ne fait que rafraîchir la grille.
    if (!$('#choixPhoto').open) $('#choixPhoto').showModal();
  }

  $('#grillePhotos').addEventListener('click', function (ev) {
    var f = ev.target.closest('figure');
    if (!f || !ciblePhoto) return;
    ciblePhoto(f.dataset.nom);
    if (cheminPhoto) patcher(cheminPhoto, f.dataset.nom);
    $('#choixPhoto').close();
    marquerModifie();
    dessiner();
  });

  $('#boutonEnvoi').addEventListener('click', function () { $('#fichier').click(); });

  /* ---- téléversement d'une photo --------------------------------------
     Message affiché DANS le sélecteur, et qui ne s'efface jamais tout seul :
     une erreur ici doit rester lisible sous les yeux, à l'endroit où on l'a
     déclenchée. C'est `dire()` qui sert aux messages fugaces de la page. */
  function direPhoto(msg, genre) {
    var e = $('#etatPhoto');
    e.textContent = msg || '';
    e.className = msg ? (genre || 'info') : '';
  }

  var EXT_HEIC = /\.(heic|heif)$/i;
  var estHeic = function (f) {
    return EXT_HEIC.test(f.name || '') || /hei[cf]/i.test(f.type || '');
  };

  // Message d'aide, affiché seulement quand le navigateur ne SAIT PAS lire le
  // HEIC. Safari (iPhone, Mac récent) le lit ; Chrome et Firefox non.
  var AIDE_HEIC =
    'Cette photo est au format HEIC (format par défaut de l\'iPhone) et ce '
    + 'navigateur ne sait pas l\'ouvrir.\n\n'
    + 'Trois façons de s\'en sortir, au choix :\n'
    + '• Ouvrir cette page sur l\'iPhone lui-même (Safari sait lire le HEIC).\n'
    + '• Se l\'envoyer par WhatsApp ou par e-mail : la photo arrive en JPEG.\n'
    + '• Sur l\'iPhone : Réglages → Appareil photo → Formats → « Le plus '
    + 'compatible ». Les photos suivantes seront prises en JPEG.';

  // Décode le fichier en quelque chose que le canvas sait dessiner.
  // createImageBitmap d'abord : c'est LUI qui sait lire le HEIC là où le
  // système le sait (Safari). <img> ensuite, pour les navigateurs plus âgés.
  function decoder(fichier) {
    var parImage = function () {
      return new Promise(function (resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(fichier);
        img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = function () {
          URL.revokeObjectURL(url);
          reject(new Error(estHeic(fichier) ? AIDE_HEIC : 'Photo illisible : le format n\'est pas reconnu.'));
        };
        img.src = url;
      });
    };
    if (typeof createImageBitmap !== 'function') return parImage();
    return createImageBitmap(fichier).catch(parImage);
  }

  // Redimensionne et compresse dans le navigateur : une photo de téléphone
  // fait 4 à 8 Mo, elle rendrait le site lent et dépasserait la limite.
  function preparer(fichier) {
    return decoder(fichier).then(function (src) {
      var max = 1600;
      var l = src.width, h = src.height;
      if (!l || !h) throw new Error('Photo illisible : dimensions inconnues.');
      if (l > max) { h = Math.round(h * max / l); l = max; }
      var c = document.createElement('canvas');
      c.width = l; c.height = h;
      c.getContext('2d').drawImage(src, 0, 0, l, h);
      if (src.close) src.close();
      var q = 0.85, url;
      do { url = c.toDataURL('image/jpeg', q); q -= 0.07; }
      while (url.length * 0.75 > 250 * 1024 && q > 0.5);

      // Un canvas qui échoue (mémoire, image trop grande sur iOS) ne lève pas
      // d'erreur : il renvoie « data:, ». Sans ce contrôle, cette chaîne part
      // vers GitHub comme si c'était une photo, et l'échec est incompréhensible.
      // 512 caractères : très en dessous de la plus petite photo réelle
      // (une photo de chantier compressée en fait ~200 000), mais très
      // au-dessus de ce que produit un canvas en échec.
      if (!/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(url) || url.length < 512) {
        throw new Error(
          'Le navigateur n\'a pas réussi à convertir cette photo : le résultat '
          + 'est vide.\n\nC\'est en général une photo trop grande pour la '
          + 'mémoire de l\'appareil. Réessayez avec une photo plus légère.');
      }
      return url;
    });
  }

  $('#fichier').addEventListener('change', function (ev) {
    var f = ev.target.files[0];
    if (!f) return;
    var nom = prompt(
      'Nom du fichier ?\n\nMinuscules, chiffres et tirets, sans accent. Exemple :\nbeton-cellulaire-elevation-peronnas.jpg',
      f.name.toLowerCase().replace(/\.(jpe?g|png|webp)$/i, '').normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) + '.jpg');
    if (!nom) return;

    // Une photo du même nom existe déjà : on ne l'écrase JAMAIS en silence.
    // Elle peut servir ailleurs sur le site — la remplacer changerait ces
    // endroits-là aussi, sans que personne ne l'ait demandé.
    var ecraser = D.photos.indexOf(nom) !== -1;
    if (ecraser && !confirm(
        'Une photo nommée « ' + nom + ' » existe déjà.\n\n'
        + 'La remplacer changera cette photo PARTOUT où elle est utilisée sur '
        + 'le site.\n\nRemplacer quand même ?\n'
        + '(Annuler : relancez l\'envoi et choisissez un autre nom.)')) {
      direPhoto('Envoi annulé. La photo « ' + nom + ' » n\'a pas été touchée.', 'info');
      ev.target.value = '';
      return;
    }

    direPhoto('Préparation de la photo…', 'info');
    preparer(f)
      .then(function (donnees) {
        direPhoto('Envoi en cours…', 'info');
        return api('photo', {
          method: 'POST',
          body: JSON.stringify({ nom: nom, donnees: donnees, ecraser: ecraser }),
        });
      })
      .then(function (r) {
        if (!r.d.ok) { direPhoto(r.d.erreur || 'Envoi impossible.', 'mal'); return; }
        if (D.photos.indexOf(r.d.nom) === -1) D.photos.push(r.d.nom);
        D.photos.sort();
        var cible = ciblePhoto, chemin = cheminPhoto;
        ouvrirPhotos(cible, chemin);
        direPhoto(r.d.remplacee
          ? 'Photo « ' + r.d.nom + ' » remplacée. Elle est à jour partout où elle est utilisée.'
          : 'Photo ajoutée. Choisissez-la dans la liste pour l\'utiliser.', 'bien');
      })
      .catch(function (e) { direPhoto(e.message, 'mal'); });
    ev.target.value = '';
  });

  /* ---- champs ---------------------------------------------------------- */
  function champ(etiquette, valeur, surChangement, multiligne, chemin) {
    var id = 'c' + Math.random().toString(36).slice(2);
    setTimeout(function () {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function () {
        surChangement(el.value);
        if (chemin) patcher(chemin, el.value);
        marquerModifie();
      });
    });
    return '<label for="' + id + '">' + ech(etiquette) + '</label>' +
      (multiligne
        ? '<textarea id="' + id + '">' + ech(valeur) + '</textarea>'
        : '<input id="' + id + '" value="' + ech(valeur) + '">');
  }

  function bloc(titre, aide, corps) {
    return '<div class="bloc"><h2>' + ech(titre) + '</h2><p class="aide">' + ech(aide) + '</p>' + corps + '</div>';
  }

  function vignette(nomPhoto, surChoix, chemin) {
    var id = 'v' + Math.random().toString(36).slice(2);
    setTimeout(function () {
      var el = document.getElementById(id);
      if (el) el.addEventListener('click', function () { ouvrirPhotos(surChoix, chemin); });
    });
    return '<div><img class="vignette" id="' + id + '" src="/assets/img/' + encodeURIComponent(nomPhoto) +
      '" alt=""><div class="sous" onclick="document.getElementById(\'' + id + '\').click()">changer</div></div>';
  }

  /* ---- vues ------------------------------------------------------------ */
  function vueBandeau() {
    var c = D.contenu;
    var photos = c.bandeau.map(function (b, i) {
      return '<div class="carte">' + vignette(b.img, function (n) { b.img = n; }, 'bandeau.' + i + '.img') +
        '<div><span class="num">PHOTO ' + (i + 1) + '</span>' +
        champ('Description de la photo (pour Google et les malvoyants)', b.alt,
          function (v) { b.alt = v; }, true, 'bandeau.' + i + '.alt') +
        '</div></div>';
    }).join('');

    var pa = c.partage;
    var partage = '<div class="carte">' +
      '<div><img class="vignette" id="vPartage" src="/assets/og/' + encodeURIComponent(pa.img) + '" alt="">' +
      '<div class="sous">image fixe</div></div>' +
      '<div>' + champ('Texte affiché avec l\'aperçu', pa.alt, function (v) { pa.alt = v; }, true, 'partage.alt') +
      '<p class="aide" style="margin-top:10px">Cette image apparaît quand on partage un lien du site sur WhatsApp, Facebook ou LinkedIn. Elle a un format particulier (1200 × 630) : pour la remplacer, passez par le développeur.</p>' +
      '</div></div>';

    return bloc('Les 6 photos du bandeau d\'accueil',
      'La mosaïque derrière le titre K-PROBAT, tout en haut du site. Cliquez sur une photo pour la remplacer.', photos) +
      bloc('Aperçu de partage', 'Ce que voient WhatsApp et les réseaux sociaux quand on partage un lien.', partage);
  }

  function vueAccueil() {
    var c = D.contenu;
    var metiers = c.savoirFaire.map(function (m, i) {
      return '<div class="carte">' + vignette(m.img, function (n) { m.img = n; }, 'savoirFaire.' + i + '.img') +
        '<div><span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
        champ('Titre (court — un titre long est coupé)', m.t, function (v) { m.t = v; }, false, 'savoirFaire.' + i + '.t') +
        champ('Sous-titre', m.tech, function (v) { m.tech = v; }, false, 'savoirFaire.' + i + '.tech') +
        '</div></div>';
    }).join('');

    var bc = c.betonCellulaire;
    var section = '<div class="carte">' + vignette(bc.img, function (n) { bc.img = n; }, 'betonCellulaire.img') + '<div>' +
      champ('Description de la photo (pour Google et les malvoyants)', bc.imgAlt, function (v) { bc.imgAlt = v; }, true, 'betonCellulaire.imgAlt') +
      '</div></div>' +
      champ('Paragraphe 1', bc.p1, function (v) { bc.p1 = v; }, true, 'betonCellulaire.p1') +
      champ('Paragraphe 2 — phrase partenaires (validée, à ne pas reformuler)', bc.p2, function (v) { bc.p2 = v; }, true, 'betonCellulaire.p2') +
      champ('Paragraphe 3 — phrase 15 ans (validée, à ne pas reformuler)', bc.p3, function (v) { bc.p3 = v; }, true, 'betonCellulaire.p3') +
      champ('Grand chiffre', bc.chiffre, function (v) { bc.chiffre = v; }, false, 'betonCellulaire.chiffre') +
      champ('Phrase sous le chiffre', bc.chiffreTexte, function (v) { bc.chiffreTexte = v; }, true, 'betonCellulaire.chiffreTexte');

    return bloc('Les 8 métiers', 'Cliquez sur une photo pour la remplacer. L\'ordre des cartes est l\'ordre de la liste.', metiers) +
      bloc('Section béton cellulaire', 'Le bloc de l\'accueil qui renvoie vers la page Siporex.', section);
  }

  function vueRealisations() {
    var lignes = D.contenu.realisations.map(function (r, i) {
      return '<div class="carte">' + vignette(r.img, function (n) { r.img = n; }, 'realisations.' + i + '.img') +
        '<div><span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
        champ('Titre du chantier', r.t, function (v) { r.t = v; }, false, 'realisations.' + i + '.t') +
        champ('Lieu et année', r.meta, function (v) { r.meta = v; }, false, 'realisations.' + i + '.meta') +
        '</div></div>';
    }).join('');
    return bloc('Galerie des réalisations',
      'Huit chantiers. La disposition en quinconce est fixe : seuls la photo, le titre et l\'année changent.', lignes);
  }

  function vueSiporex() {
    var p = D.contenu.pagePilier;
    var corps = ['photo1', 'photo2', 'photo3'].map(function (cle, i) {
      var ph = p[cle];
      return '<div class="carte">' + vignette(ph.img, function (n) { ph.img = n; }, 'pagePilier.' + cle + '.img') +
        '<div><span class="num">PHOTO ' + (i + 1) + '</span>' +
        champ('Légende affichée sous la photo', ph.legende, function (v) { ph.legende = v; }, false, 'pagePilier.' + cle + '.legende') +
        champ('Description de la photo (pour Google et les malvoyants)', ph.alt, function (v) { ph.alt = v; }, true, 'pagePilier.' + cle + '.alt') +
        '</div></div>';
    }).join('');
    return bloc('Page Siporex & Ytong', 'Les trois photos de la page. Le texte de la page se modifie avec le développeur.', corps);
  }

  function vueVilles() {
    return D.villes.villes.map(function (v) {
      return bloc(v.nom + ' (' + v.cp + ')', 'Page /maconnerie-' + v.slug,
        champ('Distance depuis Montagnat', v.distance, function (x) { v.distance = x; }) +
        champ('Introduction', v.intro, function (x) { v.intro = x; }, true) +
        champ('Le bâti local', v.contexte, function (x) { v.contexte = x; }, true) +
        champ('Un chantier du secteur', v.chantier, function (x) { v.chantier = x; }, true) +
        champ('Question fréquente', v.question, function (x) { v.question = x; }) +
        champ('Réponse', v.reponse, function (x) { v.reponse = x; }, true));
    }).join('');
  }

  function dessiner() {
    if (!D) return;
    var rendus = {
      bandeau: vueBandeau, accueil: vueAccueil, realisations: vueRealisations,
      siporex: vueSiporex, villes: vueVilles,
    };
    $('#editeur').innerHTML = rendus[vue]();
    var page = vue === 'siporex' ? '/maconnerie-beton-cellulaire-siporex-ytong' : '/';
    var cadre = $('#cadre');
    if (cadre.src.split('?')[0].replace(location.origin, '') !== page) cadre.src = page;
    majTitreApercu();
  }

  $('#onglets').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-vue]');
    if (!b) return;
    vue = b.dataset.vue;
    [].forEach.call(this.querySelectorAll('button'), function (x) {
      x.setAttribute('aria-selected', String(x === b));
    });
    dessiner();
  });

  /* ---- publication ----------------------------------------------------- */
  $('#publier').addEventListener('click', function () {
    var b = $('#publier');
    b.disabled = true;
    b.textContent = 'Publication…';
    api('enregistrer', { method: 'POST', body: JSON.stringify({ contenu: D.contenu, villes: D.villes }) })
      .then(function (r) {
        b.textContent = 'Publier';
        if (!r.d.ok) { dire(r.d.erreur || 'Publication refusée.', 'mal'); b.disabled = false; return; }
        modifie = false;
        $('#compteur').textContent = 'à jour';
        dire(r.d.message, 'bien');
        majTitreApercu();
      })
      .catch(function () { b.textContent = 'Publier'; b.disabled = false; dire('Le site ne répond pas.', 'mal'); });
  });

  window.addEventListener('beforeunload', function (ev) {
    if (modifie) { ev.preventDefault(); ev.returnValue = ''; }
  });
})();
</script>
</body>
</html>
