     SIGNATURE IPPYX — bloc commun à tous les sites de l'agence (étalon).
     Source unique : src/partials/signature.html, injecté dans chaque page
     par build.mjs (jeton SIGNATURE entre doubles accolades). Le lien est
     généré depuis site.config.json → "client" (utm_source) : ne pas l'écrire.
     Pied de page sombre : tel quel. Pied de page clair : ajouter la classe
     ippyx-sig-wrap--light sur le <div> ci-dessous.

     signature, blancs (jamais néon — le néon est réservé à la signature),
     zone tactile ≥ 44 px. Les pages visées sont src/mentions-legales.html et
